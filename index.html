<!doctype html>
<html lang="ko"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#e8590c"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes"><title>Lunch Roulette</title>
<style>
:root{--bg:#faf6f0;--fg:#2b2118;--card:#fff;--mut:#7d6f61;--ac:#e8590c;--ln:#eadfd2;--ok:#2f9e44;--no:#d9480f;--soft:#f4ede4}
@media(prefers-color-scheme:dark){:root{--bg:#1c1712;--fg:#f3ebe2;--card:#272019;--mut:#a99a89;--ac:#ff8a47;--ln:#3b3128;--ok:#51cf66;--no:#ff8a65;--soft:#2f2720}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.55 system-ui,-apple-system,"Apple SD Gothic Neo","Noto Sans KR",sans-serif;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom);-webkit-text-size-adjust:100%}
#app{max-width:560px;margin:auto;padding:0 16px 100px;min-height:100dvh}
a{color:var(--ac)}
button,select,input{font:inherit;color:var(--fg);background:var(--card);border:1px solid var(--ln);border-radius:10px;padding:9px 12px}
button{cursor:pointer}
header{position:sticky;top:0;z-index:5;display:flex;justify-content:space-between;align-items:center;padding:14px 0 10px;background:linear-gradient(var(--bg) 75%,transparent)}
h1{font-size:20px;margin:0;font-weight:800;letter-spacing:-.01em}
.ib{border:0;background:none;padding:8px;border-radius:50%;color:var(--fg);display:flex}.tb{border:0;background:none;color:var(--ac);font-weight:700;padding:8px 4px}
.card{background:var(--card);border:1px solid var(--ln);border-radius:16px;padding:16px;margin-bottom:12px}
.mut{color:var(--mut);font-size:14px}.ok{color:var(--ok)}.no{color:var(--no)}
.hero{text-align:center;padding:8px 0 4px}
.locb{border-radius:99px;font-size:14px;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;margin-bottom:14px}
#slot{font-size:26px;font-weight:800;min-height:40px;margin:6px 0;word-break:keep-all;line-height:1.3}
#slot.flick{opacity:.5}#slot.done{animation:pop .5s;color:var(--ac)}
@keyframes pop{0%{transform:scale(.8)}60%{transform:scale(1.08)}100%{transform:scale(1)}}
.spin{width:150px;height:150px;border-radius:50%;border:0;color:#fff;background:conic-gradient(from 200deg,#ff922b,#e8590c,#f03e3e,#ff922b);box-shadow:0 10px 30px rgba(232,89,12,.45);display:flex;flex-direction:column;align-items:center;justify-content:center;margin:14px auto;font-size:18px;transition:transform .15s}
.spin span{font-size:48px;line-height:1.1}.spin:active{transform:scale(.94)}.spin.busy{animation:rot .8s linear infinite}
@keyframes rot{to{transform:rotate(360deg)}}
#msg{min-height:22px;margin:4px 0}
.sumrow{display:flex;gap:6px;flex-wrap:wrap;justify-content:center;margin-top:8px}
.tag{display:inline-block;background:var(--soft);border-radius:8px;padding:3px 10px;font-size:13px;color:var(--fg)}
.fbtn{border-radius:8px;padding:3px 12px;font-size:13px;background:var(--ac);color:#fff;border:0}
nav{position:fixed;left:0;right:0;bottom:0;display:flex;justify-content:center;background:var(--card);border-top:1px solid var(--ln);padding:4px 0 calc(4px + env(safe-area-inset-bottom));z-index:6}
nav button{flex:1;max-width:200px;border:0;background:none;font-size:15px;color:var(--mut);padding:12px 0;border-radius:0}
nav .on{color:var(--ac);font-weight:700}
.ov{position:fixed;inset:0;background:#0006;z-index:8}
.sheet{position:fixed;left:0;right:0;bottom:0;max-width:520px;margin:auto;background:var(--card);border-radius:22px 22px 0 0;padding:12px 20px calc(20px + env(safe-area-inset-bottom));z-index:9;max-height:88dvh;overflow:auto;animation:up .25s}
@keyframes up{from{transform:translateY(40px);opacity:0}}
.grab{width:40px;height:4px;border-radius:9px;background:var(--ln);margin:0 auto 12px}.sheet h3{margin:0 0 4px;font-size:18px}
.lb{font-size:13px;color:var(--mut);margin:18px 0 8px;font-weight:600}
.pills{display:flex;flex-wrap:wrap;gap:6px}
.pill{border-radius:99px;padding:7px 14px;font-size:14px}.pill.on,.pill.i{background:var(--ac);color:#fff;border-color:var(--ac)}.pill.x{background:var(--soft);color:var(--mut);text-decoration:line-through}
input[type=range]{width:100%;accent-color:var(--ac);padding:0;border:0;background:none;height:32px}
.rr{display:flex;justify-content:space-between;font-size:12px;color:var(--mut)}.rv-now{font-size:22px;font-weight:800;color:var(--ac)}
.primary{background:var(--ac);color:#fff;border:0;font-weight:700;width:100%;padding:14px;font-size:16px;border-radius:12px;margin-top:20px}
.li{display:block;width:100%;text-align:left;margin:6px 0;padding:12px;font-size:15px}.li.here{color:var(--ac);font-weight:700}
input[type=text],input[type=password]{width:100%}
/* result */
.rc{animation:up .35s;padding:0;overflow:hidden}
.ph{width:100%;height:190px;object-fit:cover;display:block;background:var(--soft)}
.rb{padding:16px}
.nm{font-size:22px;font-weight:800;line-height:1.3;margin:0}
.sub{color:var(--mut);font-size:14px;margin-top:2px}
.info{margin-top:14px;border:1px solid var(--ln);border-radius:12px}
.info>div{padding:10px 12px;border-top:1px solid var(--ln)}.info>div:first-child{border:0}
.info .k{font-size:12px;color:var(--mut);display:block}.info .v{font-size:15px;font-weight:600;word-break:keep-all}
.wk{margin:6px 0 0;padding:0;list-style:none;font-size:14px}.wk li{padding:2px 0}.wk li.today{font-weight:700;color:var(--ac)}
.link{background:none;border:0;color:var(--ac);padding:4px 0;font-size:14px}
h4{font-size:13px;color:var(--mut);margin:20px 0 8px;font-weight:700;letter-spacing:.02em}
.lead{font-size:15px;font-weight:600;margin:0 0 8px}
.ai{background:var(--soft);border-radius:12px;padding:12px;font-size:15px;margin:8px 0}.ai .disc{font-size:12px;color:var(--mut);margin-top:6px}
.q{border-left:3px solid var(--ac);padding:2px 0 2px 12px;margin:10px 0;font-size:15px}.q small{display:block;color:var(--mut);font-size:12px;margin-top:2px}
.tags{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}
ul.why{padding-left:18px;margin:8px 0;font-size:15px}ul.why li{margin:4px 0}
.rv{padding:10px 0;border-top:1px solid var(--ln);font-size:15px}.rv:first-of-type{border:0}.rv .st{color:var(--ac);letter-spacing:1px}.rv .m{font-size:12px;color:var(--mut)}
.mapf{width:100%;height:220px;border:0;border-radius:12px;margin-top:16px;display:block}
.btns{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}
.btns a,.btns button,.acts a,.acts button{display:flex;align-items:center;justify-content:center;text-align:center;text-decoration:none;border-radius:10px;padding:11px 6px;font-size:14px;font-weight:600;line-height:1.25}
.btns a,.btns button{background:var(--ac);color:#fff;border:0}
.acts{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}.acts a,.acts button{flex:1;min-width:96px;color:var(--fg);background:var(--card);border:1px solid var(--ln)}
.src{font-size:12px;color:var(--mut);margin-top:14px}
/* history & settings */
.h{border-top:1px solid var(--ln);padding:12px 0}.h:first-child{border:0}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:8px}.row label{font-size:13px;color:var(--mut)}
textarea{width:100%;font:inherit;color:var(--fg);background:var(--card);border:1px solid var(--ln);border-radius:10px;padding:9px}
.srow{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:10px 0;border-top:1px solid var(--ln)}.srow:first-of-type{border:0}
.seg{display:flex;background:var(--soft);border-radius:10px;padding:3px}.seg button{border:0;background:none;padding:6px 14px;font-size:14px;border-radius:8px}.seg .on{background:var(--card);font-weight:700;box-shadow:0 1px 3px #0002}
.ct{font-size:16px;margin:0 0 4px}
.steps{padding-left:20px;margin:10px 0;font-size:14px;color:var(--mut)}.steps li{margin:6px 0}
code{background:var(--soft);border-radius:6px;padding:1px 5px;font-size:13px;word-break:break-all}
.pw{display:flex;gap:8px;margin-top:10px}.pw input{flex:1}.pw button{background:var(--ac);color:#fff;border:0;font-weight:700}
.banner{display:block;width:100%;border:1px dashed var(--ac);color:var(--ac);background:none;border-radius:12px;padding:10px 12px;margin:0 0 6px;font-size:14px;text-align:left}
</style></head><body><div id="app"></div>
<script>
const $=s=>document.querySelector(s),sleep=ms=>new Promise(r=>setTimeout(r,ms));
const ld=(k,d)=>{try{return JSON.parse(localStorage.getItem(k))??d}catch{return d}},sv=(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v))}catch{}};
const NL=navigator.language||'';
let S=Object.assign({lang:NL.startsWith('ko')?'ko':'en',unit:/^en-US/i.test(NL)?'mi':'km',radius:1609,open:false,ff:true,inc:[],exc:[],tab:'pick',place:null,recent:[],key:'',minR:0},ld('lr_s',{}));
if(!['pick','hist'].includes(S.tab))S.tab='pick';
let H=ld('lr_h',[]),F=ld('lr_f',{}),B=ld('lr_b',{});
let last=null,busy=false,rvOpen=null,W=null,cache=null,rvMore=false,wkMore=false,sheet=false,locSheet=false,view='main',unlocked=false,lastC=null,LS=[],lsT=null,lsN=0,sess=null;
const save=()=>{sv('lr_s',S);sv('lr_h',H);sv('lr_f',F);sv('lr_b',B)};
const L=(k,e)=>S.lang=='ko'?k:e;
const loc_=()=>S.lang=='ko'?'ko-KR':'en-US';
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const CU=[['korean','한식','Korean','🍚'],['japanese','일식','Japanese','🍣'],['chinese','중식','Chinese','🥟'],['italian','이탈리안','Italian','🍝'],['american','양식·버거','American','🍔'],['thai','태국','Thai','🍜'],['vietnamese','베트남','Vietnamese','🍲'],['indian','인도','Indian','🍛'],['mexican','멕시칸','Mexican','🌮'],['other','기타','Other','🍽️']];
const cuName=c=>{const x=CU.find(y=>y[0]==c)||CU[9];return L(x[1],x[2])};
const cuO=s=>{s=(s||'').toLowerCase();
  return /korean|한식|국밥|김밥|찌개|삼겹|고깃집|분식|떡볶이|냉면|비빔밥|순두부|갈비|bibimbap|bulgogi|tofu/.test(s)?'korean'
  :/japan|sushi|ramen|udon|soba|izakaya|teriyaki|스시|초밥|라멘|우동|돈카츠|돈까스|이자카야/.test(s)?'japanese'
  :/chin|dim ?sum|dumpling|szechuan|sichuan|짜장|짬뽕|마라|중화|딤섬/.test(s)?'chinese'
  :/ital|pizza|pasta|피자|파스타/.test(s)?'italian'
  :/american|burger|steak|bbq|barbecue|chicken|wings|diner|sandwich|버거|치킨|스테이크/.test(s)?'american'
  :/thai|태국/.test(s)?'thai':/vietnam|pho|banh|쌀국수|베트남/.test(s)?'vietnamese':/india|curry|인도/.test(s)?'indian'
  :/mexic|taco|burrito|taqueria|멕시/.test(s)?'mexican':'other'};
const dist=(a,b,c,d)=>{const r=x=>x*Math.PI/180,h=Math.sin(r(c-a)/2)**2+Math.cos(r(a))*Math.cos(r(c))*Math.sin(r(d-b)/2)**2;return 12742e3*Math.asin(Math.sqrt(h))};
const fd=d=>{if(S.unit=='mi'){const mi=d/1609.344;return mi<.095?Math.max(50,Math.round(d*3.28084/50)*50)+' ft':mi.toFixed(mi<9.95?1:0)+' mi'}return d<1000?Math.round(d/10)*10+' m':(d/1000).toFixed(d<9950?1:0)+' km'};
const loc=()=>new Promise((ok,no)=>navigator.geolocation?navigator.geolocation.getCurrentPosition(p=>ok(p.coords),no,{enableHighAccuracy:true,timeout:10000,maximumAge:60000}):no(new Error('geo')));
const PWH=212569102,fnv=s=>{let h=0x811c9dc5;for(const c of s){h^=c.charCodeAt(0);h=Math.imul(h,0x01000193)>>>0}return h};

/* ---------- radius slider: 0.1 mi … 20 mi ---------- */
const RMIN=160,RMAX=32187;
const r2v=r=>Math.round(100*Math.log(Math.max(RMIN,r)/RMIN)/Math.log(RMAX/RMIN));
const v2r=v=>{let m=RMIN*Math.pow(RMAX/RMIN,v/100);
  if(S.unit=='mi'){const mi=m/1609.344;m=(mi<1?Math.round(mi*10)/10:mi<5?Math.round(mi*4)/4:Math.round(mi))*1609.344}
  else m=m<1000?Math.round(m/50)*50:m<5000?Math.round(m/250)*250:Math.round(m/1000)*1000;
  return Math.round(Math.min(RMAX,Math.max(RMIN,m)))};
function rIn(v){S.radius=v2r(+v);const e=$('#rlab');if(e)e.textContent=fd(S.radius)}

/* ---------- opening_hours parser (OSM) ---------- */
const DN=['Su','Mo','Tu','We','Th','Fr','Sa'];
function oh(s,d=new Date()){
  if(!s)return{};s=String(s).trim();
  const td=d.getDay(),yd=(td+6)%7,mn=d.getHours()*60+d.getMinutes();
  let open,today,known=false,any=false,ovn=false;
  for(let r of s.split(';')){r=r.trim();if(!r||/^(PH|SH)\b/.test(r))continue;
    if(/^24\/7/.test(r)){any=known=true;open=true;today='24h';continue}
    let days=[0,1,2,3,4,5,6],t=r;const m=r.match(/^([A-Z][a-z][A-Za-z ,\-]*?)\s*(?=\d|[Oo]ff|[Cc]losed)/);
    if(m){days=[];m[1].split(',').forEach(x=>{const[a,b]=x.split('-').map(y=>DN.indexOf(y.trim().slice(0,2)));if(a<0)return;if(b==null||b<0){days.push(a);return}for(let i=a;;i=(i+1)%7){days.push(i);if(i==b)break}});t=r.slice(m[0].length)}
    if(!days.length)continue;
    if(/^\s*([Oo]ff|[Cc]losed)/.test(t)){any=true;if(days.includes(td)){known=true;open=false;today=L('휴무','Closed')}continue}
    const rg=[...t.matchAll(/(\d{1,2}):(\d{2})\s*-\s*(\d{1,2}):(\d{2})/g)].map(x=>{const a=+x[1]*60+ +x[2];let b=+x[3]*60+ +x[4];if(b<=a)b+=1440;return[a,b]});
    if(!rg.length)continue;any=true;
    if(days.includes(td)){known=true;open=rg.some(([a,b])=>mn>=a&&mn<b);today=t.trim()}
    if(days.includes(yd)&&rg.some(([a,b])=>b>1440&&mn<b-1440))ovn=true}
  if(ovn)open=true;else if(!known&&any){open=false;today=L('오늘 휴무','Closed today')}
  return any?{open,today}:{}}

/* ---------- free data: OpenStreetMap ---------- */
const OV=['https://overpass-api.de/api/interpreter','https://overpass.private.coffee/api/interpreter','https://maps.mail.ru/osm/tools/overpass/api/interpreter','https://overpass.kumi.systems/api/interpreter'];
function tFetch(u,o,ms,ac){const t=setTimeout(()=>ac.abort(new Error('timeout')),ms);return fetch(u,{...o,signal:ac.signal}).finally(()=>clearTimeout(t))}
async function overpass(la,lo){
  const ams=S.ff?['restaurant','fast_food','food_court']:['restaurant'];
  const q=`[out:json][timeout:25];(${ams.map(a=>`nwr["amenity"="${a}"]["name"](around:${S.radius},${la},${lo});`).join('')});out center tags qt 300;`;
  const acs=OV.map(()=>new AbortController());
  try{return await Promise.any(OV.map((u,i)=>tFetch(u,{method:'POST',body:'data='+encodeURIComponent(q)},30000,acs[i]).then(async r=>{
      if(!r.ok)throw new Error('HTTP '+r.status);const j=await r.json();if(!j.elements)throw new Error('bad');
      return j.elements.map(e=>{const t=e.tags||{},c=(t.cuisine||'').replace(/_/g,' ');
        return{id:'o:'+e.type+e.id,name:(S.lang=='ko'?t['name:ko']:t['name:en'])||t.name,cu:cuO(c+' '+t.name),tx:t.name+' '+c,la:e.lat??e.center?.lat,lo:e.lon??e.center?.lon,
          hrs:t.opening_hours,ff:t.amenity!='restaurant',addr:[t['addr:housenumber'],t['addr:street']].filter(Boolean).join(' '),
          tel:t.phone||t['contact:phone'],web:t.website||t['contact:website']}}).filter(p=>p.la&&p.name)})))}
  finally{acs.forEach(a=>{try{a.abort()}catch{}})}}
async function photon(la,lo){
  const ams=S.ff?['restaurant','fast_food','food_court']:['restaurant'],tags=ams.map(a=>'osm_tag=amenity:'+a).join('&'),km=S.radius/1000;
  const base='https://photon.komoot.io',urls=[`${base}/reverse?lat=${la}&lon=${lo}&radius=${km}&limit=50&${tags}`,`${base}/api/?q=restaurant&lat=${la}&lon=${lo}&limit=50&${tags}`];
  const res=await Promise.allSettled(urls.map(u=>tFetch(u,{},15000,new AbortController()).then(r=>{if(!r.ok)throw new Error('HTTP '+r.status);return r.json()})));
  const fs=res.filter(r=>r.status=='fulfilled').flatMap(r=>r.value.features||[]);
  if(!fs.length)throw new Error('photon');
  const tp={N:'node',W:'way',R:'relation'},seen={};
  return fs.map(f=>{const p=f.properties||{};return{id:'o:'+(tp[p.osm_type]||p.osm_type)+p.osm_id,name:p.name,cu:cuO(p.name),tx:p.name||'',la:f.geometry.coordinates[1],lo:f.geometry.coordinates[0],ff:p.osm_value!='restaurant',addr:[p.housenumber,p.street].filter(Boolean).join(' ')}})
    .filter(p=>p.name&&!seen[p.id]&&(seen[p.id]=1))}
async function oPlaces(la,lo){
  const k=[la.toFixed(3),lo.toFixed(3),S.radius,S.ff,S.lang].join();
  if(cache&&cache.k==k&&Date.now()-cache.t<6e5)return cache.v;
  const slow=setTimeout(()=>msg(L('지도 서버가 느려요. 조금만 기다려 주세요…','The map server is slow. Hang on…')),7000);
  try{let v;
    try{v=await overpass(la,lo)}catch{msg(L('예비 서버로 검색 중…','Trying the backup server…'));v=await photon(la,lo)}
    cache={k,t:Date.now(),v};return v}
  catch{throw new Error(L('지도 데이터 서버에 연결하지 못했어요. 잠시 후 다시 시도하세요.','Could not reach the map data servers. Try again shortly.'))}
  finally{clearTimeout(slow)}}
async function weather(la,lo){try{const j=await(await fetch(`https://api.open-meteo.com/v1/forecast?latitude=${la}&longitude=${lo}&current=temperature_2m,weather_code`)).json();return{t:j.current.temperature_2m,c:j.current.weather_code}}catch{return null}}

/* ---------- Google Places API (New) ---------- */
const GT={korean:['korean_restaurant'],japanese:['japanese_restaurant','sushi_restaurant','ramen_restaurant'],chinese:['chinese_restaurant'],italian:['italian_restaurant','pizza_restaurant'],american:['american_restaurant','hamburger_restaurant','steak_house','barbecue_restaurant'],thai:['thai_restaurant'],vietnamese:['vietnamese_restaurant'],indian:['indian_restaurant'],mexican:['mexican_restaurant']};
const AT=[['servesLunch','점심 메뉴','Serves lunch'],['dineIn','매장 식사','Dine-in'],['takeout','포장','Takeout'],['delivery','배달','Delivery'],['reservable','예약 가능','Reservations'],['goodForGroups','단체 가능','Good for groups'],['outdoorSeating','야외 좌석','Outdoor seating'],['servesVegetarianFood','채식 메뉴','Vegetarian options'],['goodForChildren','아이 동반','Kid-friendly']];
/* Pool: many cheap Nearby Search (Pro) calls at random points inside the radius → every restaurant in range can come up.
   Details (rating, reviews, hours…) are fetched only for the one that gets picked. */
const FMP=['id','displayName','types','location','shortFormattedAddress'].map(f=>'places.'+f).join();
const FMD=['id','displayName','types','rating','userRatingCount','currentOpeningHours','regularOpeningHours','reviews','reviewSummary','location','shortFormattedAddress','photos','priceLevel','nationalPhoneNumber','websiteUri','googleMapsUri','editorialSummary',...AT.map(a=>a[0])].join();
const gH=fm=>({'Content-Type':'application/json','X-Goog-Api-Key':S.key,...(fm?{'X-Goog-FieldMask':fm}:{})});
async function gErrMsg(r){let m='';try{m=(await r.json()).error.message}catch{}
  if(r.status==403)m=L('키 제한 설정을 확인하세요 (웹사이트 주소 · Places API (New) 허용)','Check key restrictions (website URL · Places API (New))')+(m?' — '+m:'');
  return 'Google '+r.status+(m?': '+m:'')}
const rndPt=(la,lo,R)=>{const r=R*Math.sqrt(Math.random()),th=Math.random()*2*Math.PI;return[la+r*Math.cos(th)/111320,lo+r*Math.sin(th)/(111320*Math.cos(la*Math.PI/180))]};
async function gNear(la,lo,rad,types,fb){
  const r=await tFetch('https://places.googleapis.com/v1/places:searchNearby',{method:'POST',headers:gH(FMP),
    body:JSON.stringify({includedTypes:fb?['restaurant']:types,maxResultCount:20,rankPreference:'DISTANCE',languageCode:S.lang,locationRestriction:{circle:{center:{latitude:la,longitude:lo},radius:Math.round(Math.min(rad,50000))}}})},15000,new AbortController());
  if(!r.ok){if(r.status==400&&!fb)return gNear(la,lo,rad,types,1);throw new Error(await gErrMsg(r))}
  return((await r.json()).places||[]).map(p=>{const ty=(p.types||[]).join(' '),nm=p.displayName?.text||'';
    return{id:'g:'+p.id,pid:p.id,name:nm,cu:cuO(ty+' '+nm),tx:nm+' '+ty,la:p.location.latitude,lo:p.location.longitude,addr:p.shortFormattedAddress,ff:(p.types||[]).includes('fast_food_restaurant'),g:1,lite:1}}).filter(p=>p.name)}
let gpool=null;const dcache=new Map();
async function gPool(la,lo){
  const k=[la.toFixed(3),lo.toFixed(3),S.radius,S.ff,S.lang,S.inc.join(),S.key.slice(-6)].join();
  if(!gpool||gpool.k!=k||Date.now()-gpool.t>18e5)gpool={k,t:Date.now(),m:new Map(),calls:0};
  if(gpool.calls>=14)return[...gpool.m.values()];
  let t=S.inc.flatMap(c=>GT[c]||[]);if(!t.length)t=['restaurant',...(S.ff?['fast_food_restaurant']:[])];
  const R=S.radius,rs=Math.max(250,R*.4),first=gpool.calls==0,pts=[];
  if(first)pts.push([la,lo,Math.min(R,Math.max(250,R*.5))]);
  while(pts.length<(first?(R<=600?1:4):2)){const[a,b]=rndPt(la,lo,R);pts.push([a,b,rs])}
  const res=await Promise.allSettled(pts.map(([a,b,r])=>gNear(a,b,r,t)));
  res.forEach(r=>{if(r.status=='fulfilled')r.value.forEach(p=>{if(!gpool.m.has(p.id))gpool.m.set(p.id,p)})});
  gpool.calls+=pts.length;
  if(!gpool.m.size){const e=res.find(r=>r.status=='rejected');if(e)throw e.reason}
  return[...gpool.m.values()]}

async function osmGeo(q){const c=lastC||(S.place&&{latitude:S.place.la,longitude:S.place.lo}),bias=c?`&lat=${c.latitude}&lon=${c.longitude}`:'';
  const[a,b]=await Promise.allSettled([
    tFetch(`https://photon.komoot.io/api/?q=${encodeURIComponent(q)}&limit=8${bias}`,{},8000,new AbortController()).then(r=>r.json()).then(j=>(j.features||[]).map(f=>({n:pName(f.properties||{}),la:f.geometry.coordinates[1],lo:f.geometry.coordinates[0]}))),
    tFetch(`https://nominatim.openstreetmap.org/search?format=jsonv2&limit=8&accept-language=${S.lang}&q=${encodeURIComponent(q)}`,{},8000,new AbortController()).then(r=>r.json()).then(j=>j.map(x=>({n:nName(x.display_name),la:+x.lat,lo:+x.lon})))]);
  const all=[...(b.value||[]),...(a.value||[])].filter(x=>x.n),hn=(q.match(/^\s*(\d+)/)||[])[1],seen={};
  if(a.status=='rejected'&&b.status=='rejected')throw new Error('geo');
  const kept=[];
  return all.filter(x=>{if(kept.some(y=>dist(x.la,x.lo,y.la,y.lo)<40))return false;kept.push(x);return true}).sort((x,y)=>(hn?(y.n.startsWith(hn)-x.n.startsWith(hn)):0)).slice(0,8)}

function highlights(rv){const out=[];
  (rv||[]).filter(v=>(v.r||0)>=4).forEach(v=>{const ss=(v.t||'').replace(/([.!?。！？])\s+/g,'$1\n').split(/\n+/).map(x=>x.trim()).filter(x=>x.length>=20&&x.length<=170);
    let best=null,bs=0;ss.forEach(x=>{const sc=(x.match(POS)||[]).length;if(sc>bs){bs=sc;best=x}});if(best)out.push({t:best,a:v.a})});
  return out.slice(0,3)}
function crowd(p){if(p.open===false)return null;const d=new Date(),t=d.getHours()+d.getMinutes()/60,we=[0,6].includes(d.getDay());
  const mine=H.filter(h=>h.id==p.id&&h.rv&&h.rv.crowd&&h.rv.time).filter(h=>{const[a,b]=h.rv.time.split(':');return Math.abs(+a+b/60-t)<=1.5}).map(h=>h.rv.crowd);
  if(mine.length){const a=mine.reduce((x,y)=>x+y)/mine.length;return{lv:a>=3.7?2:a>=2.4?1:0,src:L('이 시간대 내 방문 기록 기준','Based on your visits around this time')}}
  const g=(c,w)=>Math.exp(-(((t-c)/w)**2));let v=.12+.85*g(we?12.75:12.25,.75)+.9*g(18.75,1.1)+(we?.3*g(15,2):0);
  v=Math.min(1,v)*(.55+.6*(p.n?Math.min(1,Math.log10(p.n+1)/3.3):.5));
  return{lv:v>=.62?2:v>=.33?1:0,src:L('시간대와 인기도로 추정','Estimated from time of day and popularity')}}

const msg=t=>{const e=$('#msg');if(e)e.textContent=t};
async function go(){
  if(busy)return;busy=true;last=null;$('#res').innerHTML='';msg(S.place?'':L('위치 확인 중…','Getting your location…'));
  try{
    const c=S.place?{latitude:S.place.la,longitude:S.place.lo}:await loc().catch(()=>{throw new Error(L('위치 권한이 필요해요. 위치를 허용하거나 위의 위치 버튼으로 원하는 곳을 검색하세요.','Location permission is needed. Allow it, or search for a place with the location button above.'))});
    if(!S.place)lastC=c;
    msg(L('반경 안 음식점 모으는 중…','Collecting restaurants in range…'));
    const wp=weather(c.latitude,c.longitude);let raw=null,gErr='';
    if(S.key){try{raw=await gPool(c.latitude,c.longitude)}catch(e){gErr=e.message;msg(L('Google 오류 — 무료 지도로 검색 중…','Google error — using free map data…'))}}
    if(!raw)raw=await oPlaces(c.latitude,c.longitude);W=await wp;
    const seen={};let list=raw.filter(p=>{p.d=dist(c.latitude,c.longitude,p.la,p.lo);if(!p.g){const o=oh(p.hrs);p.open=o.open;p.today=o.today}
      if(seen[p.name]||B[p.id]||p.d>S.radius*1.03)return false;seen[p.name]=1;
      if(S.inc.length&&!S.inc.includes(p.cu))return false;if(S.exc.includes(p.cu))return false;
      if(S.open&&p.open===false)return false;return true});
    if(!list.length){msg(L('반경 안에 조건에 맞는 음식점이 없어요. 반경을 넓히거나 필터를 줄여보세요.','No matches in range. Widen the radius or relax the filters.'));busy=false;return}
    const cx=ctx(),now=Date.now();
    /* pure random within the radius; only small nudges for favorites / recently visited */
    let sc=list.map(p=>{let s=1;const why=[],mr=myR(p.id);
      if(mr){s+=(mr-3)*.3;why.push(L(`내 평가 ★${mr.toFixed(1)}`,`Your rating ★${mr.toFixed(1)}`))}
      if(F[p.id]){s+=.6;why.push(L('찜해 둔 맛집이에요','One of your favorites'))}
      if(H.some(h=>h.id==p.id&&now-h.ts<3*864e5))s*=.3;
      return{p,why,s:Math.max(.05,s)}});
    const draw=()=>{let r=Math.random()*sc.reduce((a,b)=>a+b.s,0);for(const x of sc){r-=x.s;if(r<=0)return x}return sc[sc.length-1]};
    let pick=null,skipped=0;
    for(let tries=0,max=(S.minR||S.open)?10:3;tries<max&&sc.length;tries++){const x=draw();
      if(x.p.g&&x.p.lite){msg(L('가게 정보 확인 중…','Checking place details…'));
        try{x.p=await gDetails(x.p)}catch(e){if(!gErr)gErr=e.message}}
      if((S.open&&x.p.open===false)||(x.p.g&&S.minR&&!(x.p.rt>=S.minR))){sc=sc.filter(y=>y!==x);skipped++;continue}
      pick=x;break}
    if(!pick){msg(L('조건(별점·영업 중)에 맞는 곳을 찾지 못했어요. 다시 뽑거나 조건을 줄여보세요.','Could not find a place matching rating/open filters. Spin again or relax them.'));busy=false;return}
    cx.forEach(x=>{if(x.re&&x.re.test(pick.p.tx))pick.why.push(L(...x.k))});
    pick.total=list.length;pick.more=!!(pick.p.g&&gpool&&gpool.calls<14);
    msg('');rvMore=false;wkMore=false;await spin(list,pick.p);last=pick;
    H.unshift({id:pick.p.id,name:pick.p.name,la:pick.p.la,lo:pick.p.lo,ts:now});H=H.slice(0,100);save();showRes();
    if(gErr)msg(L('Google 일부 오류: ','Google issue: ')+gErr);
    if(pick.p.g&&!pick.p.rs&&S.lang!='en')gSummary(pick.p);
  }catch(e){msg(e.message)}
  busy=false}
async function spin(list,p){const el=$('#slot');let d=50;el.classList.remove('done');el.classList.add('flick');$('.spin')?.classList.add('busy');
  for(let i=0;i<18;i++){el.textContent=list[Math.floor(Math.random()*list.length)].name;await sleep(d);d*=1.13}
  el.classList.remove('flick');$('.spin')?.classList.remove('busy');el.textContent=p.name;void el.offsetWidth;el.classList.add('done')}

  return p.hrs?`<ul class="wk">${p.hrs.split(';').map(x=>`<li>${esc(x.trim())}</li>`).join('')}</ul>`:''}
function showRes(){if(!last)return;const{p,why}=last,l=links(p),mr=myR(p.id),vc=visits(p.id),st=status(p),cr=crowd(p);
  const notes=H.filter(h=>h.id==p.id&&h.rv&&h.rv.memo).slice(0,2);
  const web=p.web&&/^https?:\/\//.test(p.web)?p.web:p.web?'https://'+p.web:'';
  const pr=PL[p.pr]?(S.lang=='ko'?'₩':'$').repeat(PL[p.pr]):'';
  const rvs=p.rv||[],shown=rvMore?rvs:rvs.slice(0,2),long=rvs.length>2||rvs.some(v=>v.t.length>200);
  const hl=highlights(rvs);
  const img=p.ph&&S.key?`<img class="ph" src="https://places.googleapis.com/v1/${p.ph}/media?maxWidthPx=900&key=${encodeURIComponent(S.key)}" alt="" loading="lazy" onerror="this.remove()">`:'';
  const sub=[cuName(p.cu)+(p.ff?L(' · 간편식',' · Quick bite'):''),pr,fd(p.d)].filter(Boolean).join(' · ');
  const rating=p.rt?`★ ${p.rt} <span class="mut">(${(p.n||0).toLocaleString()})</span>`:mr?`★ ${mr.toFixed(1)} <span class="mut">${L('내 평가','your rating')}</span>`:'';
  const lead=L(`반경 ${fd(S.radius)} 안 음식점 ${last.total}곳${last.more?' 이상':''} 중에서 무작위로 뽑았어요`,`Randomly picked from ${last.total}${last.more?'+':''} restaurants within ${fd(S.radius)}`)+(p.rt?`<br>★ ${p.rt} · ${L('리뷰','reviews')} ${(p.n||0).toLocaleString()}${L('개','')}`:'');
  const reasons=[lead?`<p class="lead">${lead}</p>`:'',
    p.rs?`<div class="ai">${esc(p.rs.t)}<div class="disc">${esc(p.rs.d||'Summarized with Gemini')}${p.uri?` · <a href="${esc(p.uri)}" target="_blank" rel="noopener">${L('Google 리뷰 보기','See Google reviews')}</a>`:''}</div></div>`:'',
    hl.length?`<div class="mut" style="margin-top:10px">${L('리뷰에서 칭찬한 점','What reviewers praise')}</div>`+hl.map(h=>`<div class="q">“${esc(h.t)}”<small>${esc(h.a||'')}</small></div>`).join(''):'',
    p.at&&p.at.length?`<div class="tags">${p.at.map(a=>{const x=AT.find(y=>y[0]==a);return`<span class="tag">${L(x[1],x[2])}</span>`}).join('')}</div>`:'',
    p.sum&&!p.rs?`<p class="mut">${esc(p.sum)}</p>`:'',
    why.length?`<ul class="why">${why.map(w=>`<li>${esc(w)}</li>`).join('')}</ul>`:''].join('');
  $('#res').innerHTML=`<div class="card rc">${img}<div class="rb">
  <h2 class="nm">${esc(p.name)}</h2><div class="sub">${esc(sub)}${rating?' · '+rating:''}</div>${p.addr?`<div class="sub">${esc(p.addr)}</div>`:''}
  <div class="info">
    <div><span class="k">${L('지금','Right now')}</span><span class="v ${st.c}">${esc(st.t)}</span></div>
    <div><span class="k">${L('오늘 영업시간','Today’s hours')}</span><span class="v">${esc(p.today||L('정보 없음','Not available'))}</span>
      ${p.wk||p.hrs?`<br><button class="link" onclick="wkMore=!wkMore;showRes()">${wkMore?L('접기','Hide'):L('요일별 영업시간 보기','See weekly hours')}</button>${wkMore?weekHTML(p):''}`:''}</div>
    ${cr?`<div><span class="k">${L('혼잡도','How busy')}</span><span class="v">${CL()[cr.lv]}</span><span class="k">${esc(cr.src)}${p.uri?` · <a href="${esc(p.uri)}" target="_blank" rel="noopener">${L('실시간은 Google 지도에서','Live data on Google Maps')}</a>`:''}</span></div>`:''}
  </div>
  <h4>${L('추천 이유','Why this pick')}</h4>${reasons||`<p class="mut">${L('이 근처에서 무작위로 골랐어요.','Picked at random from nearby options.')}</p>`}
  ${rvs.length?`<h4>${L('Google 리뷰','Google reviews')}</h4>`+shown.map(v=>`<div class="rv"><span class="st">${'★'.repeat(Math.round(v.r||0))}</span> <b>${esc(v.a)}</b> <span class="m">${esc(v.w||'')}</span><div>${esc(rvMore||v.t.length<=200?v.t:v.t.slice(0,200)+'…')}</div></div>`).join('')
    +(long?`<button class="link" onclick="rvMore=!rvMore;showRes()">${rvMore?L('리뷰 접기','Show less'):L(`리뷰 ${rvs.length}개 전체 보기`,`Show all ${rvs.length} reviews`)}</button>`:''):''}
  ${notes.length?`<h4>${L('내 메모','My notes')}</h4>`+notes.map(h=>`<div class="rv"><span class="st">${'★'.repeat(h.rv.star)}</span> <span class="m">${new Date(h.ts).toLocaleDateString(loc_())}</span><div>${esc(h.rv.memo)}</div></div>`).join(''):''}
  <iframe class="mapf" src="${esc(mapSrc(p))}" loading="lazy" referrerpolicy="no-referrer-when-downgrade" allowfullscreen></iframe>
  <div class="btns"><a href="${l.g}" target="_blank" rel="noopener">Google ${L('지도','Maps')}</a><a href="${l.a}" target="_blank" rel="noopener">Apple ${L('지도','Maps')}</a><button onclick="share()">${L('Tesla로 보내기','Send to Tesla')}</button></div>
  ${p.tel||web?`<div class="acts">${p.tel?`<a href="tel:${esc(p.tel.split(';')[0].replace(/[^\d+]/g,''))}">${L('전화하기','Call')}</a>`:''}${web?`<a href="${esc(web)}" target="_blank" rel="noopener">${L('웹사이트','Website')}</a>`:''}</div>`:''}
  <div class="acts"><button onclick="favT('${p.id}',last.p.name);showRes()">${F[p.id]?L('찜 해제','Remove favorite'):L('찜하기','Favorite')}</button><button onclick="blkT('${p.id}',last.p.name);msg(L('이 가게는 앞으로 제외돼요','This place will be excluded'))">${L('다신 안 감','Never again')}</button></div>
  <div class="src">${p.g?L('장소 정보·리뷰 제공: Google','Place info & reviews: Google'):L('장소 정보: OpenStreetMap','Place info: OpenStreetMap')}${vc>1?' · '+L(`${vc-1}번 방문`,`${vc-1} past visits`):''}</div></div></div>`}
async function share(){const{p}=last,l=links(p),d={title:p.name,text:p.name+(p.addr?' '+p.addr:''),url:l.v||l.g};
  try{if(navigator.share)await navigator.share(d);else{await navigator.clipboard.writeText(d.text+' '+d.url);msg(L('링크를 복사했어요. Tesla 앱에 붙여넣기 하세요.','Link copied — paste it into the Tesla app.'))}}catch{}}

/* ---------- favorites / blacklist / history / review ---------- */
function favT(id,n){F[id]?delete F[id]:F[id]=n;save()}
function blkT(id,n){B[id]?delete B[id]:B[id]=n;save()}
function rvSave(i){const g=k=>$('#rv_'+k).value;H[i].rv={time:g('t'),crowd:+g('c'),svc:+g('s'),spd:+g('p'),min:+g('m'),star:+g('o'),memo:g('n')};rvOpen=null;save();render()}
const sel=(id,v)=>`<select id="rv_${id}">${[1,2,3,4,5].map(i=>`<option ${i==(v||3)?'selected':''}>${i}</option>`).join('')}</select>`;
function histHTML(){return H.length?H.map((h,i)=>{const r=h.rv,dt=new Date(h.ts).toLocaleDateString(loc_()),nm=esc(h.name).replace(/'/g,'');
  return`<div class="h"><b>${esc(h.name)}</b> <span class="mut">${dt}${F[h.id]?L(' · 찜',' · Favorite'):''}${B[h.id]?L(' · 제외',' · Excluded'):''}</span>
  ${r?`<div class="mut">★ ${r.star} · ${r.time||'-'} · ${L('붐빔','Crowd')} ${r.crowd}/5 · ${L('서비스','Service')} ${r.svc}/5 · ${L('음식 속도','Speed')} ${r.spd}/5 · ${r.min}${L('분',' min')}${r.memo?'<br>'+esc(r.memo):''}</div>`:''}
  <div class="acts"><button onclick="rvOpen=${i};render()">${r?L('리뷰 수정','Edit review'):L('리뷰 쓰기','Write review')}</button><button onclick="favT('${h.id}','${nm}');render()">${F[h.id]?L('찜 해제','Unfavorite'):L('찜하기','Favorite')}</button><button onclick="blkT('${h.id}','${nm}');render()">${B[h.id]?L('제외 해제','Undo exclude'):L('제외','Exclude')}</button></div>
  ${rvOpen===i?`<div class="card" style="margin-top:10px"><div class="row"><label>${L('방문 시각','Visit time')}</label><input type="time" id="rv_t" value="${r?.time||'12:00'}"></div>
  <div class="row"><label>${L('붐빔 (1 한산 ~ 5 매우)','Crowd (1 empty – 5 packed)')}</label>${sel('c',r?.crowd)}<label>${L('서비스','Service')}</label>${sel('s',r?.svc)}</div>
  <div class="row"><label>${L('음식 속도 (1 느림 ~ 5 빠름)','Food speed (1 slow – 5 fast)')}</label>${sel('p',r?.spd)}<label>${L('총 체류(분)','Total minutes')}</label><input type="number" id="rv_m" value="${r?.min||40}" style="width:80px"></div>
  <div class="row"><label>${L('총평','Overall')}</label>${sel('o',r?.star)}</div><textarea id="rv_n" rows="2" placeholder="${L('메모','Notes')}">${esc(r?.memo||'')}</textarea>
  <div class="acts"><button onclick="rvSave(${i})">${L('저장','Save')}</button><button onclick="rvOpen=null;render()">${L('취소','Cancel')}</button></div></div>`:''}</div>`}).join(''):`<div class="mut">${L('아직 기록이 없어요.','No history yet.')}</div>`}
const listHTML=(o,fn)=>Object.keys(o).length?Object.entries(o).map(([k,v])=>`<div class="srow"><span>${esc(v)}</span><button onclick="${fn}('${k}','');render()">${L('삭제','Remove')}</button></div>`).join(''):`<div class="mut">${L('없음','None')}</div>`;

/* ---------- settings ---------- */
function unlock(){const v=($('#pw')?.value||'').trim();if(fnv(v)===PWH){unlocked=true;render()}else{const m=$('#pwm');if(m)m.textContent=L('비밀번호가 틀렸어요.','Wrong password.')}}
const seg=(on,fn,t)=>`<button class="${on?'on':''}" onclick="${fn}">${t}</button>`;
function setLang(v){S.lang=v;cache=null;gpool=null;save();render()}
function settingsHTML(){const o=esc(location.origin);
  return`<div class="card"><p class="ct"><b>${L('일반','General')}</b></p>
  <div class="srow"><span>${L('언어','Language')}</span><div class="seg">${seg(S.lang=='ko',"setLang('ko')",'한국어')}${seg(S.lang=='en',"setLang('en')",'English')}</div></div>
  <div class="srow"><span>${L('거리 단위','Distance unit')}</span><div class="seg">${seg(S.unit=='mi',"S.unit='mi';save();render()",L('마일 (mi)','Miles'))}${seg(S.unit=='km',"S.unit='km';save();render()",L('킬로미터 (km)','Kilometers'))}</div></div></div>
  <div class="card"><p class="ct"><b>Google API</b> <span class="tag">${S.key?L('연결됨','Connected'):L('미연결 · 무료 지도 사용 중','Not connected · using free map data')}</span></p>
  ${!unlocked?`<p class="mut">${L('API 키를 보거나 바꾸려면 비밀번호를 입력하세요.','Enter the password to view or change the API key.')}</p>
    <div class="pw"><input type="password" id="pw" inputmode="numeric" autocomplete="off" placeholder="${L('비밀번호','Password')}" onkeydown="if(event.key=='Enter')unlock()"><button onclick="unlock()">${L('잠금 해제','Unlock')}</button></div><div id="pwm" class="no mut" style="margin-top:6px"></div>`
  :`<ol class="steps"><li>${L('<a href="https://console.cloud.google.com" target="_blank" rel="noopener">Google Cloud 콘솔</a>에서 프로젝트를 만들고 결제 계정 연결','Create a project in the <a href="https://console.cloud.google.com" target="_blank" rel="noopener">Google Cloud console</a> and link billing')}</li>
    <li>${L('API 라이브러리에서 <b>Places API (New)</b>와 <b>Maps Embed API</b> 사용 설정','Enable <b>Places API (New)</b> and <b>Maps Embed API</b> in the API Library')}</li>
    <li>${L('사용자 인증 정보 → API 키 만들기','Credentials → Create API key')}</li>
    <li>${L(`키 제한: 웹사이트에 <code>${o}/*</code> 등록, API는 위 2개만 허용`,`Restrict the key to <code>${o}/*</code> and the 2 APIs above`)}</li>
    <li>${L('할당량에서 Nearby Search를 하루 50회 정도로 제한하면 요금 걱정이 없어요','Cap Nearby Search at about 50/day in Quotas to avoid charges')}</li></ol>
    <input type="password" value="${esc(S.key)}" placeholder="AIza…" autocomplete="off" onchange="S.key=this.value.replace(/[^A-Za-z0-9_-]/g,'');gpool=null;save();render()">
    <div class="acts">${S.key?`<button onclick="S.key='';gpool=null;save();render()">${L('키 삭제','Remove key')}</button>`:''}<button onclick="unlocked=false;render()">${L('잠그기','Lock')}</button></div>
    <p class="mut" style="margin-top:10px">${L('키가 없거나 오류가 나면 OpenStreetMap(무료)으로 자동 전환돼요. 키는 이 기기에만 저장돼요.','Without a key, or on errors, the app falls back to OpenStreetMap (free). The key is stored only on this device.')}</p>`}</div>
  <div class="card"><p class="ct"><b>${L('찜한 맛집','Favorites')}</b> <span class="mut">${L('추천 확률이 올라가요','picked more often')}</span></p>${listHTML(F,'favT')}</div>
  <div class="card"><p class="ct"><b>${L('제외 목록','Excluded')}</b></p>${listHTML(B,'blkT')}</div>`}

/* ---------- render ---------- */
const GEAR='<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>';
const chipCls=c=>S.inc.includes(c)?'i':S.exc.includes(c)?'x':'';
function chip(c){const i=S.inc.indexOf(c),x=S.exc.indexOf(c);if(i>=0){S.inc.splice(i,1);S.exc.push(c)}else if(x>=0)S.exc.splice(x,1);else S.inc.push(c);save();render()}
const pill=(on,fn,t)=>`<button class="pill ${on?'on':''}" onclick="${fn}">${t}</button>`;
const sum=()=>[L('반경 ','Within ')+fd(S.radius),...(S.key&&S.minR?['★ '+S.minR+'+']:[]),...(S.open?[L('영업 중만','Open only')]:[]),...(S.ff?[]:[L('식당만','Restaurants only')]),...S.inc.map(cuName),...S.exc.map(c=>L('제외: ','No ')+cuName(c))].map(x=>`<span class="tag">${esc(x)}</span>`).join('')+`<button class="fbtn" onclick="sheet=true;render()">${L('필터','Filters')}</button>`;
const sheetH=()=>`<div class="ov" onclick="sheet=false;save();render()"></div><div class="sheet"><div class="grab"></div><h3>${L('필터','Filters')}</h3>
<div class="lb">${L('검색 반경','Search radius')}</div><div class="rv-now" id="rlab">${fd(S.radius)}</div>
<input type="range" min="0" max="100" step="1" value="${r2v(S.radius)}" oninput="rIn(this.value)" onchange="save()" aria-label="${L('검색 반경','Search radius')}">
<div class="rr"><span>${fd(RMIN)}</span><span>${S.unit=='mi'?'20 mi':'32 km'}</span></div>
${S.key?`<div class="lb">${L('최소 Google 별점','Minimum Google rating')}</div><div class="pills">${[0,3.5,4,4.3,4.5].map(r=>pill(r==S.minR,`S.minR=${r};save();render()`,r?'★ '+r+'+':L('전체','Any'))).join('')}</div>`:''}
<div class="lb">${L('옵션','Options')}</div><div class="pills">${pill(S.open,'S.open=!S.open;save();render()',L('문 닫은 곳 제외','Hide closed places'))}${pill(S.ff,'S.ff=!S.ff;save();render()',L('패스트푸드 포함','Include fast food'))}</div>
<div class="lb">${L('음식 종류 (한 번 탭 = 포함, 두 번 = 제외)','Cuisine (tap once = include, twice = exclude)')}</div><div class="pills">${CU.map(c=>`<button class="pill ${chipCls(c[0])}" onclick="chip('${c[0]}')">${c[3]} ${L(c[1],c[2])}</button>`).join('')}</div>
<button class="primary" onclick="sheet=false;save();render()">${L('적용','Apply')}</button></div>`;
function render(){
  const inSet=view=='set';
  const body=inSet?settingsHTML():S.tab=='hist'?`<div class="card">${histHTML()}</div>`
    :`${S.key?'':`<button class="banner" onclick="view='set';render()">${L('Google API 키를 연결하면 별점·리뷰·사진·지도를 볼 수 있어요 →','Connect a Google API key for ratings, reviews, photos and maps →')}</button>`}
    <div class="hero"><button class="locb" onclick="locSheet=true;render();setTimeout(()=>$('#lsq')?.focus(),60)">${S.place?esc(S.place.n):L('현재 위치','Current location')} ▾</button>
    <div class="mut">${L('오늘 점심은?','What’s for lunch?')}</div><div id="slot">${last?esc(last.p.name):'?'}</div>
    <button class="spin" onclick="go()"><span>🎲</span><b>${L('뽑기','SPIN')}</b></button><div id="msg" class="mut"></div>
    <div class="sumrow">${sum()}</div></div><div id="res"></div>${sheet?sheetH():''}${locSheet?locSheetH():''}`;
  $('#app').innerHTML=`<header><h1>${inSet?L('설정','Settings'):L('점심 룰렛','Lunch Roulette')}</h1>${inSet?`<button class="tb" onclick="view='main';render()">${L('완료','Done')}</button>`:`<button class="ib" onclick="view='set';render()" aria-label="${L('설정','Settings')}">${GEAR}</button>`}</header><main>${body}</main>
  ${inSet?'':`<nav>${[['pick',L('뽑기','Pick')],['hist',L('기록','History')]].map(t=>`<button class="${S.tab==t[0]?'on':''}" onclick="S.tab='${t[0]}';save();render()">${t[1]}</button>`).join('')}</nav>`}`;
  document.documentElement.lang=S.lang;if(!inSet&&S.tab=='pick')showRes()}
render();
</script></body></html>
