<html lang="ko"><head><meta charset="utf-8">

<style>

*{box-sizing:border-box}
body,button,label{word-break:keep-all;overflow-wrap:anywhere}
body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.55 system-ui,-apple-system,"Apple SD Gothic Neo","Noto Sans KR",sans-serif;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom);-webkit-text-size-adjust:100%}
#app{max-width:560px;margin:auto;padding:0 16px 150px;min-height:100dvh}
a{color:var(--ac)}

button{cursor:pointer}

.mut{color:var(--mut);font-size:14px}.ok{color:var(--ok)}.no{color:var(--no)}

@keyframes pop{0%{transform:scale(.8)}60%{transform:scale(1.08)}100%{transform:scale(1)}}
.spin{width:150px;height:150px;border-radius:50%;border:0;color:#fff;background:conic-gradient(from 200deg,#ff922b,#e8590c,#f03e3e,#ff922b);box-shadow:0 10px 30px rgba(232,89,12,.45);display:flex;flex-direction:column;align-items:center;justify-content:center;margin:14px auto;font-size:18px;transition:transform .15s}
.spin span{font-size:48px;line-height:1.1;display:inline-block}.spin:active{transform:scale(.94)}
.spin{overflow:hidden}.spin.busy b{display:none}.spin.busy span{font-size:52px;animation:toss 1.05s infinite}
@keyframes toss{
 0%{transform:translateY(0) rotate(0) scale(1);animation-timing-function:ease-out}

 82%{transform:translateY(-10px) rotate(640deg) scale(1);animation-timing-function:ease-in}

 100%{transform:translateY(0) rotate(720deg) scale(1)}}
@keyframes rot{to{transform:rotate(360deg)}}

.tag{display:inline-block;background:var(--soft);border-radius:8px;padding:3px 10px;font-size:13px;color:var(--fg)}
.fbtn{border-radius:8px;padding:3px 12px;font-size:13px;background:var(--ac);color:#fff;border:0}

.ov{position:fixed;inset:0;background:#0006;z-index:8}
.sheet{position:fixed;left:0;right:0;bottom:0;max-width:520px;margin:auto;background:var(--card);border-radius:22px 22px 0 0;padding:12px 20px calc(20px + env(safe-area-inset-bottom));z-index:9;max-height:88dvh;overflow:auto;animation:up .25s}

.lb{font-size:13px;color:var(--mut);margin:18px 0 8px;font-weight:600}
.pills{display:flex;flex-wrap:wrap;gap:6px}

.src{font-size:12px;color:var(--mut);margin-top:14px}

.dl{padding:0 12px 6px;border-top:1px solid var(--ln)}
.hfront{-webkit-touch-callout:none;-webkit-user-select:none;user-select:none}

.asheet{position:fixed;left:0;right:0;bottom:0;max-width:520px;margin:auto;background:var(--card);border-radius:22px 22px 0 0;padding:16px 20px calc(18px + env(safe-area-inset-bottom));z-index:9;animation:up .25s ease;box-shadow:0 -10px 40px #0004}
.asheet p{margin:0 0 8px}.asheet .acts button{padding:14px;font-size:15px}.asheet .del,.selbar .del{background:#e03131;color:#fff;border:0;font-weight:700}

function oh(s,d=new Date()){

const idb=(()=>{let dbp;const open=()=>dbp||(dbp=new Promise((ok,no)=>{const r=indexedDB.open('lr_photos',1);r.onupgradeneeded=()=>r.result.createObjectStore('p');r.onsuccess=()=>ok(r.result);r.onerror=()=>no(r.error)}));
  const tx=async(m,f)=>{const db=await open();return new Promise((ok,no)=>{const t=db.transaction('p',m),q=f(t.objectStore('p'));t.oncomplete=()=>ok(q&&q.result);t.onerror=()=>no(t.error)})};
  return{put:(k,v)=>tx('readwrite',st=>st.put(v,k)),get:k=>tx('readonly',st=>st.get(k)),del:k=>tx('readwrite',st=>st.delete(k))}})();
const PHU=new Map(),MAXPH=6;
async function shrink(file){const url=URL.createObjectURL(file);
  try{const img=await new Promise((ok,no)=>{const i=new Image();i.onload=()=>ok(i);i.onerror=no;i.src=url});
    const enc=async(max,q)=>{const sc=Math.min(1,max/Math.max(img.naturalWidth,img.naturalHeight)),c=document.createElement('canvas');c.width=Math.round(img.naturalWidth*sc);c.height=Math.round(img.naturalHeight*sc);
      c.getContext('2d').drawImage(img,0,0,c.width,c.height);return await new Promise(ok=>c.toBlob(ok,'image/jpeg',q))};
    let b=await enc(1024,.78);if(b.size>600000)b=await enc(800,.62);return b}
  finally{URL.revokeObjectURL(url)}}
const b2d=b=>new Promise((ok,no)=>{const r=new FileReader();r.onload=()=>ok(r.result);r.onerror=no;r.readAsDataURL(b)});
const d2b=d=>fetch(d).then(r=>r.blob());
async function getPhoto(id){let b=null;try{b=await idb.get(id)}catch{}
  if(!b&&user&&FB){try{const d=await FB.getPhoto(user.uid,id);if(d){b=await d2b(d);idb.put(id,b).catch(()=>{})}}catch{}}return b}
async function putPhoto(id,b){await idb.put(id,b);if(user&&FB)FB.putPhoto(user.uid,id,await b2d(b)).catch(e=>console.error(e))}
function hydrate(root=document){root.querySelectorAll('img[data-ph]').forEach(async im=>{if(im.getAttribute('src'))return;const id=im.dataset.ph;let u=PHU.get(id);
  if(!u){const b=await getPhoto(id);if(!b){im.closest('.th')?.classList.add('gone');return}u=URL.createObjectURL(b);PHU.set(id,u)}im.src=u})}
function showPh(id){const d=document.createElement('div');d.className='pv';d.innerHTML=`<img data-ph="${id}" alt="">`;d.onclick=()=>d.remove();document.body.appendChild(d);hydrate(d)}
const thumbs=(ids,rm,big)=>ids&&ids.length?`<div class="thumbs ${big?'big':''}">${ids.map(id=>`<div class="th"><img data-ph="${id}" alt="" onclick="event.stopPropagation();showPh('${id}')">${rm?`<button class="x" aria-label="${L('사진 삭제','Remove photo')}" onclick="rmPh('${id}')">×</button>`:''}</div>`).join('')}</div>`:'';
const delPhotos=ids=>(ids||[]).forEach(id=>{idb.del(id).catch(()=>{});if(user&&FB)FB.delPhoto(user.uid,id).catch(()=>{});const u=PHU.get(id);if(u){URL.revokeObjectURL(u);PHU.delete(id)}});
async function addPh(files,inp){const room=MAXPH-rvD.photos.length;const fs=[...files].slice(0,Math.max(0,room));if(inp)inp.value='';
  if(!fs.length){if(files.length)alert(L(`사진은 최대 ${MAXPH}장까지 올릴 수 있어요.`,`Up to ${MAXPH} photos per review.`));return}
  for(const f of fs){try{const b=await shrink(f),id='ph_'+Date.now().toString(36)+Math.random().toString(36).slice(2,6);await putPhoto(id,b);rvD.photos.push(id);rvD.added.push(id)}
    catch{alert(L('사진을 불러오지 못했어요.','Could not load that photo.'))}}
  render()}
function rmPh(id){rvD.photos=rvD.photos.filter(x=>x!==id);if(rvD.added.includes(id))delPhotos([id]);else rvD.removed.push(id);render()}
function syncRv(){if(rvOpen==null||!rvD)return;const t=document.getElementById('rv_t'),m=document.getElementById('rv_m'),n=document.getElementById('rv_n');
  if(t)rvD.time=t.value;if(m)rvD.min=+m.value||0;if(n)rvD.memo=n.value}

let openRow=null,rvD=null;const ACTW=264;
function openRv(i){if(rvOpen!=null&&rvOpen!==i)rvCancel(1);rvOpen=i;openRow=null;const r=H[i].rv||{},h=H[i];
  rvD={crowd:3,spd:3,svc:3,min:40,time:'12:00',memo:'',...(h.arr?{time:hhmm(h.arr),min:stayMin(h)}:{}),...r,photos:[...(r.photos||[])],added:[],removed:[]};render();setTimeout(()=>document.querySelector('.rvf')?.scrollIntoView({behavior:'smooth',block:'center'}),50)}

function rvCancel(quiet){if(rvD)delPhotos(rvD.added);rvOpen=null;rvD=null;if(!quiet)render()}
let rvDelAsk=null;
function rvDel(){const i=rvDelAsk;rvDelAsk=null;if(i!=null&&H[i]&&H[i].rv){bump(H[i].id,'rv',-1,H[i].name);delPhotos([...(H[i].rv.photos||[]),...(rvD?rvD.added:[])]);delete H[i].rv;save()}rvOpen=null;rvD=null;render()}
const rvDelH=()=>rvDelAsk==null||!H[rvDelAsk]?'':`<div class="ov" onclick="rvDelAsk=null;render()"></div><div class="asheet" role="dialog"><div class="grab" style="margin:0 auto 12px"></div>
  <p><b>${esc(H[rvDelAsk].name)}</b></p><p class="mut">${L('이 리뷰를 삭제할까요? 첨부한 사진도 함께 삭제돼요. 방문 기록은 남아요.','Delete this review? Its photos will be deleted too. The visit stays in history.')}</p>
  <div class="acts"><button onclick="rvDelAsk=null;render()">${L('취소','Cancel')}</button><button class="del" onclick="rvDel()">${L('리뷰 삭제','Delete review')}</button></div></div>`;
const fmtS=v=>(+v).toFixed(v%1?1:0);
const starW=(k,v)=>`<div class="sw" data-k="${k}" role="slider" aria-valuemin="0.5" aria-valuemax="5" aria-valuenow="${v}"><div class="sbg">★★★★★</div><div class="sfg" style="width:${v/5*100}%">★★★★★</div></div>`;
const RF=()=>[['crowd',L('붐빔 정도','How crowded'),L('1 한산함 · 5 매우 붐빔','1 empty · 5 packed')],['spd',L('음식 나오는 속도','Food speed'),L('1 느림 · 5 빠름','1 slow · 5 fast')],['svc',L('서비스·친절도','Customer service'),L('1 별로 · 5 최고','1 poor · 5 great')]];
function formHTML(i){return`<div class="rvf">
  <div class="fld"><label for="rv_t">${L('방문 시각','Visit time')}</label><input type="time" id="rv_t" value="${esc(rvD.time||'12:00')}"></div>
  ${RF().map(([k,t,h])=>`<div class="fld"><div class="fl"><label>${t}</label><b><span id="sv_${k}">${fmtS(rvD[k])}</span> / 5</b></div><div class="mut fh">${h}</div>${starW(k,rvD[k])}</div>`).join('')}
  <div class="fld"><label for="rv_m">${L('총 체류 시간','Total time spent')}</label><div class="mins"><input type="number" id="rv_m" inputmode="numeric" min="0" step="5" value="${+rvD.min||40}"><span>${L('분','min')}</span></div></div>

  <div class="fld"><label>${L('사진','Photos')} <span class="mut" style="font-weight:400">(${rvD.photos.length}/${MAXPH})</span></label>${thumbs(rvD.photos,1,1)}
    ${rvD.photos.length<MAXPH?`<div class="phb"><label>${L('사진 보관함','Photo library')}<input type="file" accept="image/*" multiple onchange="addPh(this.files,this)"></label><label>${L('카메라로 찍기','Take photo')}<input type="file" accept="image/*" capture="environment" onchange="addPh(this.files,this)"></label></div>`:''}</div>
  <div class="acts"><button class="save" onclick="rvSave(${i})">${L('저장','Save')}</button><button onclick="rvCancel()">${L('취소','Cancel')}</button></div>
  ${H[i].rv?`<div class="acts"><button class="rvdel" onclick="syncRv();rvDelAsk=${i};render()">${L('리뷰 삭제','Delete review')}</button></div>`:''}</div>`}
const rvLine=r=>[r.time||'',`${L('붐빔','Crowd')} ${fmtS(r.crowd)}`,`${L('속도','Speed')} ${fmtS(r.spd)}`,`${L('서비스','Service')} ${fmtS(r.svc)}`,r.min?r.min+L('분',' min'):''].filter(Boolean).join(' · ');
let openDays=new Set(),delAsk=null;
function dayLabel(d){const n=new Date(),dd=Math.round((new Date(n.toDateString())-new Date(d.toDateString()))/864e5);
  const base=d.toLocaleDateString(loc_(),{month:'long',day:'numeric',weekday:'short',...(d.getFullYear()!=n.getFullYear()?{year:'numeric'}:{})});
  return dd==0?L('오늘 · ','Today · ')+base:dd==1?L('어제 · ','Yesterday · ')+base:base}
function togDay(k){openDays.has(k)?openDays.delete(k):openDays.add(k);openRow=null;render()}
function rowHTML(i){const h=H[i],r=h.rv,tm=new Date(h.ts).toLocaleTimeString(loc_(),{hour:'numeric',minute:'2-digit'}),nm=esc(h.name).replace(/'/g,''),fav=!!F[h.id],ex=!!B[h.id];
  return`<div class="hi"><div class="hrow"><div class="hact"><button class="a-fav" onclick="favT('${h.id}','${nm}');render()">${fav?L('찜 해제','Unfavorite'):L('찜하기','Favorite')}</button><button class="a-ex" onclick="blkT('${h.id}','${nm}');render()">${ex?L('제외 해제','Undo exclude'):L('제외','Exclude')}</button><button class="a-info" onclick="openPlace('${h.id}')">${L('가게 기록','Place info')}</button></div>

    <button class="rvb" onclick="openRv(${i})">${r?L('리뷰 수정','Edit review'):L('리뷰 쓰기','Write review')}</button></div>

let selDay=null,sel=new Set();
const dayIdx=k=>H.map((h,i)=>i).filter(i=>new Date(H[i].ts).toDateString()==k);
function enterSel(k){selDay=k;sel=new Set();openDays.add(k);openRow=null;rvOpen=null;try{navigator.vibrate&&navigator.vibrate(15)}catch{}render()}

function togSel(i){sel.has(i)?sel.delete(i):sel.add(i);render()}
function selAll(){const ids=dayIdx(selDay),all=ids.every(i=>sel.has(i));sel=all?new Set():new Set(ids);render()}
let hView='date',hq='',placeSheet=null;
const qOK=name=>!hq.trim()||name.toLowerCase().includes(hq.trim().toLowerCase());
function aggPlaces(){const m=new Map();H.forEach((h,i)=>{let a=m.get(h.id);if(!a)m.set(h.id,a={id:h.id,name:h.name,la:h.la,lo:h.lo,n:0,last:h.ts,first:h.ts,idx:[]});a.n++;a.last=Math.max(a.last,h.ts);a.first=Math.min(a.first,h.ts);a.idx.push(i)});return[...m.values()]}
const avgOf=(idx,k)=>{const v=idx.map(i=>H[i].rv&&H[i].rv[k]).filter(x=>x);return v.length?v.reduce((a,b)=>a+b)/v.length:0};
const shortD=ts=>new Date(ts).toLocaleDateString(loc_(),{month:'short',day:'numeric'});
function histHTML(){if(!H.length)return`<div class="card mut">${L('아직 기록이 없어요.','No history yet.')}</div>`;
  return`<div class="hbar"><div class="seg">${seg(hView=='date',"hView='date';selDay=null;render()",L('날짜별','By date'))}${seg(hView=='place',"hView='place';selDay=null;render()",L('가게별','By place'))}</div>
  <input type="search" id="hq" value="${esc(hq)}" placeholder="${L('가게 이름 검색','Search places')}" oninput="hq=this.value;updHist()" autocomplete="off"></div><div id="hbody">${hBody()}</div>`}
function updHist(){const b=document.getElementById('hbody');if(!b)return;b.innerHTML=hBody();bindGestures();hydrate(b)}

function placesHTML(){const ps=aggPlaces().filter(a=>qOK(a.name)).sort((a,b)=>b.n-a.n||b.last-a.last);
  if(!ps.length)return`<div class="card mut">${L('검색 결과가 없어요.','No matching places.')}</div>`;
  return`<div class="card">${ps.map(a=>{const rc=a.idx.filter(i=>H[i].rv).length,fav=!!F[a.id],ex=!!B[a.id];
    return`<div class="pl" onclick="openPlace('${a.id}')"><div class="pn"><b>${esc(a.name)}</b>${fav?`<span class="b-fav">${L('찜','Fav')}</span>`:''}${ex?`<span class="b-ex">${L('제외','Excluded')}</span>`:''}
      <div class="mut">${L('마지막 ','Last ')}${shortD(a.last)}${rc?' · '+L(`리뷰 ${rc}개`,`${rc} review${rc>1?'s':''}`):''}</div></div><div class="cnt"><b>${a.n}</b><span>${L('번 뽑힘','picks')}</span></div></div>`}).join('')}</div>

function datesHTML(){
  const G=[];H.forEach((h,i)=>{if(!qOK(h.name))return;const k=new Date(h.ts).toDateString();let g=G.find(x=>x.k==k);if(!g)G.push(g={k,ts:h.ts,items:[]});g.items.push(i)});
  if(!G.length)return`<div class="card mut">${L('검색 결과가 없어요.','No matching places.')}</div>`;
  const searching=!!hq.trim();
  return G.map(g=>{const sm=selDay===g.k,open=sm||searching||openDays.has(g.k),n=g.items.length,all=sm&&g.items.every(i=>sel.has(i));
    const right=sm?`<span class="r"><button class="sa pri" onclick="event.stopPropagation();selAll()">${all?L('선택 해제','Deselect all'):L('전체 선택','Select all')}</button><button class="sa" onclick="event.stopPropagation();exitSel()">${L('완료','Done')}</button></span>`
      :`<span class="mut">${L(n+'곳',n+(n>1?' places':' place'))}<i class="chev">›</i></span>`;
    const rows=sm?g.items.map(i=>`<div class="hsel ${sel.has(i)?'on':''}" onclick="togSel(${i})" role="checkbox" aria-checked="${sel.has(i)}"><span class="ck"></span><div class="hn"><b>${esc(H[i].name)}</b><div class="mut">${new Date(H[i].ts).toLocaleTimeString(loc_(),{hour:'numeric',minute:'2-digit'})}</div></div></div>`).join('')
      :g.items.map(rowHTML).join('');

  +`<p class="mut hint">${L('날짜를 누르면 그날 간 곳이 보여요. 가게를 탭하거나 왼쪽으로 밀면 찜·제외·가게 기록, 꾹 누르면 삭제. 날짜를 꾹 누르면 여러 곳을 골라 삭제할 수 있어요.','Tap a date to see places. Tap or swipe a place for Favorite / Exclude / Place info; long-press to remove. Long-press a date to select several.')}</p>`

function bindSwipe(fr){const row=fr.parentNode,i=+fr.dataset.i;let x0,y0,dx=0,drag=null,base=0,lpT=null,lp=false;
  const clr=()=>{clearTimeout(lpT);lpT=null};

    if(drag===null){if(Math.abs(mx)>8&&Math.abs(mx)>Math.abs(my)){drag=true;fr.style.transition='none'}else if(Math.abs(my)>8)drag=false}
    if(drag){e.preventDefault();dx=Math.min(0,Math.max(-ACTW-24,base+mx));fr.style.transform=`translateX(${dx}px)`}},{passive:false});
  row.addEventListener('touchend',e=>{clr();if(lp){e.preventDefault();return}if(!drag)return;fr.style.transition='';
    const moved=dx-base,open=base<0?moved<40:moved<-40;   /* small swipe is enough: right closes, left opens */

${MAPKEY?'':`<div class="mut" style="font-size:12px">${L('별점·리뷰 수 필터는 Google API를 연결해야 적용돼요.','Rating and review-count filters need a Google API key.')}</div>`}
<div class="lb">${L('옵션','Options')}</div><div class="pills">${pill(S.open,'S.open=!S.open;save();render()',L('문 닫은 곳 제외','Hide closed places'))}</div>
<div class="lb">${L('음식 종류 (한 번 탭 = 포함, 두 번 = 제외)','Cuisine (tap once = include, twice = exclude)')}</div>${CG.map(g=>`<div class="cg">${L(g[1],g[2])}</div><div class="pills">${CU.filter(c=>c[4]==g[0]).map(c=>`<button class="pill ${chipCls(c[0])}" onclick="chip('${c[0]}')">${c[3]} ${L(c[1],c[2])}</button>`).join('')}</div>`).join('')}
${S.inc.length||S.exc.length?`<button class="link" onclick="S.inc=[];S.exc=[];save();render()">${L('음식 종류 선택 초기화','Clear cuisine choices')}</button>`:''}
<div class="fbar"><button class="reset" onclick="resetF()">${L('초기화','Reset')}</button><button class="primary" onclick="sheet=false;save();render()">${L('적용','Apply')}</button></div></div>`;
function resetF(){Object.assign(S,{radius:1609,minR:0,minN:0,open:false,maxP:4,inc:[],exc:[]});save();keepScroll(render)}
function render(){syncRv();vWatch();
  if(view=='home'){$('#app').innerHTML=homeHTML();document.documentElement.lang=S.lang;startReel();return}
  if(view=='nick'||view=='prefs'){stopReel();$('#app').innerHTML=obHTML();document.documentElement.lang=S.lang;return}
  stopReel();
  if(view=='admin'&&!isAdmin())view='set';
  const inSet=view=='set'||view=='admin';
  const body=view=='admin'?adminHTML():inSet?settingsHTML():S.tab=='hist'?histHTML()+delH()+rvDelH()+(placeSheet?placeH():'')
    :`${MAPKEY||!isAdmin()?'':`<button class="banner" onclick="view='set';render()">${L('Google API 키를 연결하면 별점·리뷰·사진·지도를 볼 수 있어요 →','Connect a Google API key for ratings, reviews, photos and maps →')}</button>`}
    <div class="hero"><button class="locb" onclick="locSheet=true;render();setTimeout(()=>$('#lsq')?.focus(),60)">${S.place?esc(S.place.n):L('현재 위치','Current location')} ▾</button>
    <div class="mut">${L('오늘 점심은?','What’s for lunch?')}</div><div id="slot">${last?esc(last.p.name):'?'}</div>
    <button class="spin" onclick="go()"><span>🎲</span><b>${L('뽑기','SPIN')}</b></button><div id="msg" class="mut"></div>
    </div><div id="res"></div>${sheet?sheetH():''}${locSheet?locSheetH():''}`;
  const fab=!inSet&&S.tab=='pick'&&!sheet&&!locSheet?`<button class="ffab ${fabHide?'hide':''}" onclick="sheet=true;render()">${FUNNEL}${L('필터','Filters')}${fCount()?`<span class="n">${fCount()}</span>`:''}</button>`:'';
  $('#app').innerHTML=`<header><h1 ${inSet?'':`class="hlink" onclick="view='home';render()"`}>${view=='admin'?L('관리자 대시보드','Admin dashboard'):inSet?L('설정','Settings'):L('점심 룰렛','Lunch Roulette')}</h1>${inSet?`<button class="tb" onclick="view=view=='admin'?'set':'main';render()">${L('완료','Done')}</button>`:`<button class="ib" onclick="view='set';render()" aria-label="${L('설정','Settings')}">${GEAR}</button>`}</header><main>${body}</main>
  ${fab}${inSet?'':`<nav>${[['pick',L('뽑기','Pick')],['hist',L('기록','History')]].map(t=>`<button class="${S.tab==t[0]?'on':''}" onclick="S.tab='${t[0]}';save();render()">${t[1]}</button>`).join('')}</nav>`}${inSet?'':vAskH()}`;
  document.documentElement.lang=S.lang;bindGestures();if(!inSet&&S.tab=='pick')showRes();hydrate()}
/* ---------- accounts ---------- */
async function migrateGuest(){const gS=ld('lr_s',null),gH=ld('lr_h',[]),gF=ld('lr_f',{}),gB=ld('lr_b',{});
  if(gS)S=Object.assign(defS(),gS);H=gH;F=gF;B=gB;save();await pushCloud();
  for(const h of H)for(const id of (h.rv&&h.rv.photos)||[]){try{const b=await idb.get(id);if(b)await FB.putPhoto(user.uid,id,await b2d(b))}catch{}}}
function onAuth(u){if(u){user={uid:u.uid,name:u.displayName||u.email,email:u.email,photo:u.photoURL};ns='u_'+u.uid+'_';loadLocal();authReady=true;if(view=='home')view='main';render();
    FB.load(u.uid).then(async d=>{if(!user||user.uid!==u.uid)return;
      if(d){S=Object.assign(defS(),d.S||{});H=d.H||[];F=d.F||{};B=d.B||{};sv(K('lr_s'),S);sv(K('lr_h'),H);sv(K('lr_f'),F);sv(K('lr_b'),B);syncState='ok'}
      else await migrateGuest();
      last=null;cache=null;gpool=null;if(!S.nick&&view!='admin')startOb();else render()}).catch(e=>{syncState='err';console.error(e);render()})}
  else{user=null;ns='';loadLocal();authReady=true;render()}}
async function loadConfig(){if(!FB)return;try{const c=await FB.getConfig();const k=c.mapsKey||'';if(k!==MAPKEY){MAPKEY=k;sv('lr_mk',k);gpool=null;render()}}catch(e){console.error(e)}}
function initFB(){FB=window.__fb||null;if(!MAPKEY&&window.MAPS_KEY)MAPKEY=window.MAPS_KEY;
  if(FB){loadConfig();FB.onUser(u=>{onAuth(u);logVisit();if(u)FB.touchUser(u.uid,{email:u.email||'',name:u.displayName||'',photo:u.photoURL||''},0).catch(()=>{})})}else{authReady=true;render()}}
if('__fb' in window)initFB();else window.addEventListener('fbready',initFB,{once:true});
let loginMsg='';
async function doLogin(){
  if(!FB){loginMsg=L('아직 로그인 기능이 설정되지 않았어요. 사이트 관리자가 Firebase 설정을 넣어야 해요.','Sign-in is not set up yet. The site owner needs to add the Firebase settings.');render();return}
  loginMsg='';
  if(APP){const c=window.GOOGLE_APP_CLIENT||{};   /* Google blocks sign-in inside app web views → the app signs in through Chrome */
    if(!c.id){loginMsg=L('앱 로그인이 아직 설정되지 않았어요 (GOOGLE_APP_CLIENT). 로그인 없이 시작할 수 있어요.','App sign-in is not set up yet (GOOGLE_APP_CLIENT). You can start without signing in.');render();return}
    APP.googleLogin(c.id,c.secret||'');return}
  try{await FB.login()}catch(e){if(!['auth/popup-closed-by-user','auth/cancelled-popup-request'].includes(e.code)){loginMsg=L('로그인에 실패했어요: ','Sign-in failed: ')+(e.code||e.message);render()}}}
async function doLogout(){if(cloudT)await pushCloud();view='home';last=null;cache=null;gpool=null;sv('lr_guest',0);guest=false;await FB.logout();render()}
function goGuest(){guest=true;sv('lr_guest',1);if(S.ob){view='main';render()}else startOb()}
window.appLogin=async t=>{try{await FB.loginToken(t)}catch(e){loginMsg=L('로그인에 실패했어요: ','Sign-in failed: ')+(e.code||e.message);render()}};
window.appLoginErr=m=>{if(m){loginMsg=L('로그인에 실패했어요: ','Sign-in failed: ')+m;render()}};

/* ---------- onboarding: nickname (signed in) → favorite foods → first filter ---------- */
let obSel=new Set(),obEdit=false;
function startOb(){obSel=new Set(S.inc);view=user&&!S.nick?'nick':'prefs';render()}
function obNick(){const v=($('#nk')?.value||'').trim().slice(0,20);
  if(!v){$('#nkm').textContent=L('닉네임을 입력해 주세요.','Please enter a nickname.');return}
  S.nick=v;save();if(obEdit){obEdit=false;view='set'}else{obSel=new Set(S.inc);view='prefs'}render()}
function obPick(c,el){obSel.has(c)?obSel.delete(c):obSel.add(c);el.classList.toggle('on',obSel.has(c));const n=$('#obn');if(n)n.textContent=obSel.size?` (${obSel.size})`:''}
function obDone(apply){if(apply){S.inc=CU.map(c=>c[0]).filter(c=>obSel.has(c));S.exc=S.exc.filter(c=>!obSel.has(c))}S.ob=1;S.tab='pick';view='main';save();render()}
function obHTML(){const top=`<div class="home"><div class="floaters" aria-hidden="true">${floaters()}</div><div class="hcore">`;
  if(view=='nick')return top+`<div class="obs">${obEdit?'':'1 / 2'}</div><h1 class="obt">${L('닉네임을 정해 주세요','Pick a nickname')}</h1><p class="hsub">${L('앱에서 이 이름으로 불러 드릴게요','This is what the app will call you')}</p>
    <div class="obc"><input type="text" id="nk" maxlength="20" value="${esc(S.nick||(user?user.name.split(' ')[0]:''))}" placeholder="${L('닉네임','Nickname')}" autocomplete="nickname" enterkeyhint="next" onkeydown="if(event.key=='Enter')obNick()">
    <p id="nkm" class="mut no" style="margin:6px 0 0"></p><button class="primary" onclick="obNick()">${obEdit?L('저장','Save'):L('다음','Next')}</button></div></div></div>`;
  return top+`<div class="obs">${user?'2 / 2':''}</div><h1 class="obt">${L('어떤 음식을 좋아하세요?','What do you like to eat?')}</h1><p class="hsub">${L('고른 음식이 첫 필터로 설정돼요. 나중에 필터에서 바꿀 수 있어요.','Your picks become your starting filter. You can change it later in Filters.')}</p>
    <div class="obc scroll">${CG.map(g=>`<div class="cg">${L(g[1],g[2])}</div><div class="pills">${CU.filter(c=>c[4]==g[0]).map(c=>`<button class="pill ${obSel.has(c[0])?'on':''}" onclick="obPick('${c[0]}',this)">${c[3]} ${L(c[1],c[2])}</button>`).join('')}</div>`).join('')}</div>
    <div class="obb"><button class="gbtn skip" onclick="obDone(0)">${L('건너뛰기','Skip')}</button><button class="gbtn go" onclick="obDone(1)">${L('시작하기','Start')}<span id="obn">${obSel.size?` (${obSel.size})`:''}</span></button></div></div></div>`}

/* ---------- back after 5+ minutes away: show the home screen briefly, then go back in ---------- */
let hidAt=0,splash=false,splashT=null;
function appHide(){if(!hidAt)hidAt=Date.now()}
function appShow(){const away=hidAt?Date.now()-hidAt:0;hidAt=0;
  if(away<5*6e4||!['main','set'].includes(view)||rvOpen!=null||(!user&&!guest))return;
  splash=true;view='home';render();clearTimeout(splashT);splashT=setTimeout(endSplash,2600)}
function endSplash(){clearTimeout(splashT);if(!splash)return;splash=false;if(view=='home'){view='main';render()}}
document.addEventListener('visibilitychange',()=>document.visibilityState==='hidden'?appHide():appShow());

/* ---------- home / landing ---------- */
const GLOGO='<svg width="20" height="20" viewBox="0 0 48 48" aria-hidden="true"><path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/><path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/><path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"/><path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/></svg>';
const floaters=()=>Array.from({length:16},(_,i)=>{const e=['🍜','🍣','🌮','🍔','🍕','🥗','🍛','🥟','🍝','🍗','🍲','🥪','🍰','🧋','🍱','🌶️'][i];
  return`<span style="left:${(i*6.3+Math.random()*4).toFixed(1)}%;font-size:${22+Math.round(Math.random()*20)}px;animation-duration:${9+Math.random()*9}s;animation-delay:-${(Math.random()*16).toFixed(1)}s">${e}</span>`}).join('');
let reelT=null;
function stopReel(){clearTimeout(reelT);reelT=null}
function startReel(){stopReel();const pool=CU.filter(c=>c[0]!='other');let n=0;
  const step=()=>{const e=document.getElementById('reelE'),t=document.getElementById('reelT');if(!e||!t){stopReel();return}
    const c=pool[Math.floor(Math.random()*pool.length)];n++;
    if(n<20){e.textContent=c[3];e.className='spinE';t.classList.add('dim');reelT=setTimeout(step,55+n*n*.7)}
    else{e.textContent=c[3];e.className='landE';t.textContent=L(`오늘은 ${c[1]} 어때요?`,`How about ${c[2]} today?`);t.classList.remove('dim');n=0;reelT=setTimeout(step,2400)}};
  step()}
function homeHTML(){const first=esc(S.nick||(user?user.name.split(' ')[0]:''));
  return`<div class="home ${splash?'splash':''}" ${splash?'onclick="endSplash()"':''}><div class="floaters" aria-hidden="true">${floaters()}</div>
  ${splash?'':`<button class="hlang" onclick="setLang(S.lang=='ko'?'en':'ko')">${S.lang=='ko'?'EN':'한국어'}</button>`}
  <div class="hcore"><div class="logo" aria-hidden="true">🎲</div>
    <h1 class="ht">${L('점심 룰렛','Lunch Roulette')}</h1><p class="hsub">${L('오늘 점심 고민, 주사위에게 맡기세요','Let the dice decide today’s lunch')}</p>
    <div class="reel"><div class="rw"><span id="reelE">🍜</span></div><div class="rtx" id="reelT">${L('오늘은 뭐 먹지?','What should I eat?')}</div></div>
    <p class="hdesc">${L('내 주변 반경 안의 음식점 중 한 곳을 무작위로 골라 드려요. 평점·리뷰·영업시간을 함께 보여주고, 다녀온 곳은 사진과 리뷰로 기록할 수 있어요.','Picks a random restaurant within your chosen radius, shows ratings, reviews and hours, and lets you keep your own notes and photos of places you’ve been.')}</p>
    <ul class="feat"><li>📍 ${L('반경·가격·음식 종류로 범위 정하기','Set radius, price and cuisine')}</li><li>🎲 ${L('그 안에서 진짜 랜덤 추천','Truly random pick in range')}</li><li>📝 ${L('나만의 리뷰와 사진 기록','Your own reviews and photos')}</li></ul>
    ${splash?`<p class="hsub">${first?L(`${first}님, 다시 오셨네요!`,`Welcome back, ${first}!`):L('다시 오셨네요!','Welcome back!')}</p>`
    :!authReady?`<button class="gbtn" disabled>${L('확인 중…','Checking…')}</button>`
    :user?`<button class="gbtn" onclick="view='main';render()">${user.photo?`<img class="av" src="${esc(user.photo)}" alt="" referrerpolicy="no-referrer">`:''}${L(`${first}님, 이어서 하기`,`Continue as ${first}`)}</button><button class="glink" onclick="doLogout()">${L('다른 계정으로 로그인','Use another account')}</button>`
    :`<button class="gbtn" onclick="doLogin()">${GLOGO}${L('Google로 계속하기','Continue with Google')}</button><button class="glink" onclick="goGuest()">${L('로그인 없이 시작하기','Start without signing in')}</button>
      <p class="small">${L('로그인하면 기록과 설정이 계정에 저장돼서 어느 기기에서나 그대로 이어져요.','Sign in to keep your history and settings on any device.')}</p>`}
    ${loginMsg?`<p class="lerr">${esc(loginMsg)}</p>`:''}</div></div>`}

let fabHide=false,lastY=0;
window.addEventListener('scroll',()=>{const y=window.scrollY,b=document.querySelector('.ffab');
  if(y<40||y<lastY-6)fabHide=false;else if(y>lastY+6)fabHide=true;lastY=y;if(b)b.classList.toggle('hide',fabHide)},{passive:true});
render();
</script></body></html>
